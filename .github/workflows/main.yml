name: Build BioSeh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
  RELEASE_TAG: apk-latest

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Report web build
        run: |
          du -sh dist
          {
            echo "### Web build"
            echo '```'
            du -sh dist
            ls -l dist dist/assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Generate Android project
        run: bunx cap add android

      - name: Sync web build into Android project
        run: bunx cap sync android

      - name: Point Gradle at the SDK
        run: |
          chmod +x android/gradlew
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
          cat android/local.properties

      - name: Tune Gradle network settings
        run: |
          printf '%s\n' \
            'systemProp.org.gradle.internal.http.connectionTimeout=120000' \
            'systemProp.org.gradle.internal.http.socketTimeout=120000' \
            'systemProp.org.gradle.internal.repository.max.retries=5' \
            'systemProp.org.gradle.internal.repository.initial.backoff=1000' \
            >> android/gradle.properties
          cat android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: |
          # First runs download the Gradle distribution and the whole AGP/AndroidX
          # classpath; a single network hiccup should not fail the job.
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt $attempt"
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed, retrying..."
            sleep $((attempt * 15))
          done
          echo "Gradle build failed after 3 attempts" >&2
          exit 1

      - name: Diagnose toolchain
        if: failure()
        run: |
          java -version
          bun --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed || true
          ls -R android/app/build/outputs 2>/dev/null || true

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh "$APK_PATH"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "BioSeh APK (latest)" \
                 --notes "Debug-сборка из workflow Build BioSeh. Обновляется при каждом пуше в main."
          gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
