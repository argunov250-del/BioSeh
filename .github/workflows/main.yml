name: Build BioSeh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: BioSeh-web
          path: dist/
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Generate Android project
        run: bunx cap add android

      - name: Sync web build into Android project
        run: bunx cap sync android

      - name: Point Gradle at the SDK
        run: |
          chmod +x android/gradlew
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
          cat android/local.properties

      - name: Tune Gradle network settings
        run: |
          printf '%s\n' \
            'systemProp.org.gradle.internal.http.connectionTimeout=120000' \
            'systemProp.org.gradle.internal.http.socketTimeout=120000' \
            'systemProp.org.gradle.internal.repository.max.retries=5' \
            'systemProp.org.gradle.internal.repository.initial.backoff=1000' \
            >> android/gradle.properties
          cat android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: |
          # First runs download the Gradle distribution and the whole AGP/AndroidX
          # classpath; a single network hiccup should not fail the job.
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt $attempt"
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed, retrying..."
            sleep $((attempt * 15))
          done
          echo "Gradle build failed after 3 attempts" >&2
          exit 1

      - name: Diagnose toolchain
        if: failure()
        run: |
          java -version
          bun --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed || true

      - name: Upload gradle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BioSeh-gradle-logs
          path: |
            android/**/build/outputs/logs/
            android/build/reports/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioSeh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
